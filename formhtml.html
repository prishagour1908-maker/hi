<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
   
<div class="container bg-primary p-4 text-light card">
    <h2><strong>Registration Form</strong></h2>

    <form onsubmit="return checkform()">

        <label>Name</label>
        <input type="text" id="name">
        <div id="nameError" class="error"></div>

        
        <label>Email</label>
        <input type="email" id="email" required>
        <div id="emailError" class="error"></div>

        
        <label>Password</label>
        <input type="password" id="password">
        <div id="passwordError" class="error"></div>

        <input type="number"
        id="guess"
        min="1"
        max="5"
        required>

        <button type="submit">Register</button>

        <p id="success"></p>
        
    </form>
</div>

<script>

function checkform(){
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

document.getElementById("nameError").innerHTML = "";
document.getElementById("emailError").innerHTML = "";
document.getElementById("passwordError").innerHTML = "";
document.getElementById("success").innerHTML = "";

if (name == ""){
    document.getElementById("nameError").innerHTML = "Name Cannot Be Empty";
    return false;
}

if (email == ""){
    document.getElementById("emailError").innerHTML = "email Cannot Be Empty";
    return false;
}

if (password == ""){
    document.getElementById("passwordError").innerHTML = "password cannot be empty";
    return false;
}

if (password.length < 6){
    document.getElementById("passwordError").innerHTML = "Password must be more than 6 letters";
    return false;
}
document.getElementById("success").innerHTML = "form submitted";
return false;
}

</script>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
